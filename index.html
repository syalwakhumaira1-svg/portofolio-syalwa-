
<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Syalwa Khumaira</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
        }

        h1 {
            color: #1d3557;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .menu a {
            display: block;
            background: #1d3557;
            color: white;
            text-decoration: none;
            padding: 17px;
            margin-bottom: 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu a:hover {
            background: #457b9d;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
